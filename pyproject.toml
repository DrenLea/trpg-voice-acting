[project]
name = "trpgv"
version = "0.1.0"
description = "跑团文字记录 → 广播剧剧本 → 音频"
requires-python = ">=3.11"
dependencies = [
    "edge-tts>=7.0",
    "pydub>=0.25",
    "audioop-lts>=0.2; python_version >= '3.13'",
    "imageio-ffmpeg>=0.5",
    "anthropic>=0.40",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.scripts]
trpgv = "trpgv.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trpgv"]
